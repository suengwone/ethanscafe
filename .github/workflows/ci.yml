name: CI

on:
  pull_request:
  push:
    branches: [main]

# 같은 브랜치에 연달아 밀면 앞 실행은 이미 낡은 커밋을 보고 있으므로 접는다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # 손에서 쓰는 버전과 같은 값으로 못 박는다. 분석기 경고는 버전을 타므로
          # CI만 새 버전으로 올라가면 통과 여부가 사람마다 달라진다.
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: flutter pub get
      # 포맷은 리뷰에서 사람이 볼 것이 아니다. 한 번 밀리면 이후 diff가
      # 전부 공백으로 뒤덮인다.
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      # 골든은 --update-goldens 없이는 비교를 건너뛰므로 리눅스 러너에서도 흔들리지 않는다.
      - run: flutter test

  functions:
    name: Cloud Functions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # functions/package.json의 engines와 같은 메이저를 쓴다.
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm test

  rules:
    name: Security rules
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firestore_tests
    steps:
      - uses: actions/checkout@v4
      # Firestore 에뮬레이터는 JVM에서 돈다.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: firestore_tests/package-lock.json
      - run: npm ci
      - run: npm test
