<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>카카오 로그인</title>
</head>
<body>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var payload = {
        source: 'cafe-kakao-login',
        code: params.get('code'),
        state: params.get('state'),
        error: params.get('error')
      };
      if (window.opener) {
        window.opener.postMessage(payload, window.location.origin);
      }
      window.close();
    })();
  </script>
</body>
</html>
